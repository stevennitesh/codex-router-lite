<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Router Stop browser contract fixture</title>
  <style>
    body { margin: 2rem auto; padding: 0 1rem; max-width: 58rem; font: 16px system-ui, sans-serif; color: #17212b; background: #f5f7fa; }
    h1 { font-size: 1.5rem; }
    button { padding: .55rem .8rem; margin: .2rem; font: inherit; cursor: pointer; }
    nav, #rendered-chat { padding: 1rem; margin: 1rem 0; border: 1px solid #b8c4d0; border-radius: .5rem; background: white; }
    #contract-status { display: block; padding: .7rem; background: #e7eef6; }
    .label { display: inline-block; margin: 0 .4rem; }
    [data-turn-key] { padding: .5rem; border-bottom: 1px solid #d5dde5; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <h1>Router Stop browser contract fixture</h1>
  <p>This local page exercises semantic controls and rendered visibility. It sends no messages or network requests.</p>
  <nav aria-label="Fixture scenarios">
    <button type="button" data-scenario="hidden-stop-idle">Hidden Stop with idle</button>
    <button type="button" data-scenario="labelledby-transition">Labelledby transition</button>
    <button type="button" data-scenario="normalized-transition">Normalized names transition</button>
    <button type="button" data-scenario="duplicate-stop">Duplicate Stop</button>
    <button type="button" data-scenario="duplicate-idle">Duplicate idle</button>
    <button type="button" data-scenario="changed-generation">Changed latest generation</button>
    <button type="button" data-scenario="click-idle-transition">Click restores idle</button>
    <button type="button" data-scenario="absent-unconfirmed">Absent unconfirmed</button>
    <button type="button" data-scenario="explicit-complete">Explicit complete</button>
    <button type="button" data-scenario="observation-labelledby">Observation labelledby completion</button>
    <button type="button" data-scenario="observation-text">Observation text completion</button>
    <button type="button" data-scenario="observation-temporary">Observation labelledby temporary mode</button>
    <button type="button" data-scenario="observation-quoted-control">Observation quoted control</button>
    <button type="button" data-scenario="observation-indicator-transition">Observation indicator transition</button>
    <button type="button" data-scenario="send-pending">Pending Send anchor</button>
    <button type="button" data-scenario="send-history">Send with quoted history marker</button>
    <button type="button" data-scenario="send-duplicate-marker">Duplicate Send marker</button>
    <button type="button" data-scenario="send-duplicate-key">Duplicate Send identity</button>
    <button type="button" data-scenario="send-foreign-latest">Superseded Send anchor</button>
    <button type="button" data-scenario="send-disabled">Disabled Send readiness</button>
    <button type="button" data-scenario="send-aria-disabled">Aria-disabled Send readiness</button>
  </nav>
  <output id="contract-status" data-scenario="not-selected" data-stop-clicks="0" aria-live="polite">Choose a fixture scenario.</output>
  <section id="rendered-chat" aria-label="Rendered chat fixture"></section>
  <button type="button" id="advance-generation" hidden>Advance fixture generation</button>
  <button type="button" id="complete-generation" hidden>Finish fixture generation</button>
  <button type="button" id="publish-send-marker" hidden>Publish pending Send marker</button>
  <button type="button" id="publish-send-identity" hidden>Publish verified Send identity</button>
  <button type="button" id="enable-send-control" hidden>Enable fixture Send</button>
  <script>
    const chat = document.querySelector('#rendered-chat');
    const status = document.querySelector('#contract-status');
    const advance = document.querySelector('#advance-generation');
    const finish = document.querySelector('#complete-generation');
    const publishMarker = document.querySelector('#publish-send-marker');
    const publishIdentity = document.querySelector('#publish-send-identity');
    const enableSend = document.querySelector('#enable-send-control');
    const sendMarker = 'Router generation: 11111111-2222-4333-8444-555555555555';
    const sendKey = '11112222-3333-4444-8555-666677778888';
    const historyKey = '00000000-1111-4222-8333-444455556666';
    let stopClicks = 0;
    let scenario = 'not-selected';

    function record() {
      status.dataset.scenario = scenario;
      status.dataset.stopClicks = String(stopClicks);
      status.textContent = `Scenario: ${scenario}. Stop clicks: ${stopClicks}.`;
    }

    function makeTurn(key, complete = false) {
      const turn = document.createElement('article');
      turn.setAttribute('data-turn-key', key);
      const state = document.createElement('span');
      state.setAttribute('data-talvt-turn-state', complete ? 'complete' : 'running');
      state.textContent = complete ? 'Complete generation' : 'Running generation';
      turn.append(state);
      return turn;
    }

    function makeControl(kind, markup = 'direct') {
      const control = document.createElement('button');
      control.type = 'button';
      control.dataset.fixtureControl = kind;
      const name = kind === 'stop' ? 'Stop' : 'Start Voice';
      control.textContent = kind === 'stop' ? 'Stop generation' : 'Start voice session';
      if (markup === 'labelledby') {
        const label = document.createElement('span');
        label.className = 'label';
        label.id = `${kind}-semantic-label`;
        label.textContent = name;
        control.setAttribute('aria-labelledby', label.id);
        // ARIA labelledby overrides this conflicting direct label.
        control.setAttribute('aria-label', kind === 'stop' ? 'Start Voice' : 'Stop');
        chat.append(label);
      } else {
        control.setAttribute('aria-label', markup === 'normalized'
          ? kind === 'stop' ? '  \tStop\n ' : ' \n Start   Voice\t ' : name);
      }
      if (kind === 'stop') control.addEventListener('click', () => {
        stopClicks += 1;
        control.hidden = true;
        if (scenario.endsWith('-transition')) chat.append(makeControl('idle', markup));
        record();
      });
      return control;
    }

    function selectScenario(next) {
      scenario = next;
      stopClicks = 0;
      chat.replaceChildren(makeTurn('fixture-owned-generation', next === 'explicit-complete'));
      advance.hidden = next !== 'changed-generation';
      finish.hidden = next !== 'observation-indicator-transition';
      publishMarker.hidden = !['send-pending', 'send-history'].includes(next);
      publishIdentity.hidden = true;
      enableSend.hidden = !['send-disabled', 'send-aria-disabled'].includes(next);
      if (next.startsWith('send-')) {
        chat.replaceChildren();
        if (!enableSend.hidden) {
          const send = document.createElement('button');
          send.type = 'button';
          send.setAttribute('aria-label', 'Send');
          send.textContent = 'Fixture Send control';
          if (next === 'send-disabled') send.disabled = true;
          else send.setAttribute('aria-disabled', 'true');
          chat.append(send);
          record();
          return;
        }
        const message = key => {
          const turn = makeTurn(key);
          turn.append(document.createTextNode(sendMarker));
          return turn;
        };
        if (next === 'send-history') chat.append(message(historyKey));
        if (!['send-pending', 'send-history'].includes(next)) {
          chat.append(message(sendKey));
          if (next === 'send-duplicate-marker') chat.append(message('99990000-1111-4222-8333-444455556666'));
          if (next === 'send-duplicate-key') chat.append(makeTurn(sendKey));
          if (next === 'send-foreign-latest') chat.append(makeTurn('99990000-1111-4222-8333-444455556666'));
        }
        record();
        return;
      }
      if (next.startsWith('observation-')) {
        const turn = chat.querySelector('[data-turn-key]');
        turn.querySelector('[data-talvt-turn-state]').setAttribute('data-talvt-turn-state',
          next === 'observation-indicator-transition' ? 'running' : 'complete');
        const message = document.createElement('div');
        message.setAttribute('data-chatgpt-selection-message-id', '00112233-4455-6677-8899-aabbccddeeff');
        const answer = document.createElement('p');
        answer.setAttribute('data-markdown-text-style', 'assistant-message');
        answer.textContent = next === 'observation-indicator-transition' ? 'Unknown error' : 'Semantic fixture answer';
        message.append(answer);
        turn.append(message);
        const regenerate = document.createElement('button');
        regenerate.type = 'button';
        regenerate.textContent = 'Regenerate response';
        if (next === 'observation-labelledby') {
          const label = document.createElement('span');
          label.id = 'regenerate-semantic-label';
          label.textContent = 'Regenerate response';
          turn.append(label);
          regenerate.setAttribute('aria-labelledby', label.id);
          regenerate.setAttribute('aria-label', 'Conflicting direct label');
          regenerate.textContent = 'Different visible text';
        }
        if (next === 'observation-quoted-control') {
          const quoted = regenerate.cloneNode(true);
          answer.append(quoted);
        }
        turn.append(regenerate);
        if (next === 'observation-indicator-transition') {
          regenerate.hidden = true;
          chat.append(makeControl('stop'));
        }
        if (next === 'observation-temporary') {
          const label = document.createElement('span');
          label.id = 'temporary-semantic-label';
          label.textContent = 'Turn off temporary chat';
          const toggle = document.createElement('button');
          toggle.type = 'button';
          toggle.textContent = 'Different toggle text';
          toggle.setAttribute('aria-labelledby', label.id);
          toggle.setAttribute('aria-label', 'Conflicting direct label');
          chat.append(label, toggle);
        }
        record();
        return;
      }
      if (next === 'hidden-stop-idle' || next === 'duplicate-idle') {
        const stop = makeControl('stop');
        stop.hidden = true;
        chat.append(stop, makeControl('idle'));
        if (next === 'duplicate-idle') chat.append(makeControl('idle'));
      } else if (next !== 'absent-unconfirmed' && next !== 'explicit-complete') {
        const markup = next === 'labelledby-transition' ? 'labelledby'
          : next === 'normalized-transition' ? 'normalized' : 'direct';
        chat.append(makeControl('stop', markup));
        if (next === 'duplicate-stop') chat.append(makeControl('stop'));
      }
      record();
    }

    document.querySelectorAll('[data-scenario]').forEach(button => {
      if (button.tagName === 'BUTTON') button.addEventListener('click', () => selectScenario(button.dataset.scenario));
    });
    advance.addEventListener('click', () => {
      chat.append(makeTurn('fixture-successor-generation'));
      advance.hidden = true;
      record();
    });
    finish.addEventListener('click', () => {
      chat.querySelector('[data-talvt-turn-state]').setAttribute('data-talvt-turn-state', 'complete');
      chat.querySelectorAll('[data-fixture-control="stop"]').forEach(control => { control.hidden = true; });
      chat.querySelector('[data-turn-key] button').hidden = false;
      finish.hidden = true;
      record();
    });
    publishMarker.addEventListener('click', () => {
      const turn = makeTurn('renderer-placeholder');
      turn.append(document.createTextNode(sendMarker));
      chat.append(turn);
      publishMarker.hidden = true;
      publishIdentity.hidden = false;
      record();
    });
    publishIdentity.addEventListener('click', () => {
      chat.querySelector('[data-turn-key="renderer-placeholder"]').setAttribute('data-turn-key', sendKey);
      publishIdentity.hidden = true;
      record();
    });
    enableSend.addEventListener('click', () => {
      const send = chat.querySelector('button[aria-label="Send"]');
      send.disabled = false;
      send.removeAttribute('aria-disabled');
      enableSend.hidden = true;
      record();
    });
  </script>
</body>
</html>

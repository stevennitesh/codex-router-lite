name: Release

"on":
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: write
  id-token: write
  attestations: write

jobs:
  release-preflight:
    name: Verify release commit
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Require the exact tested main commit and package version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ((git rev-parse "${env:GITHUB_REF_NAME}^{commit}") -ne $env:GITHUB_SHA) { throw "Tag does not identify this commit." }
          if ((git rev-parse origin/main) -ne $env:GITHUB_SHA) { throw "Release commit is not current main." }
          $packageVersion = node -p 'require("./package.json").version'
          if ("v$packageVersion" -ne $env:GITHUB_REF_NAME) { throw "Tag does not match package version." }
          for ($attempt = 0; $attempt -lt 120; $attempt++) {
            $runs = gh api "repos/$env:GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$env:GITHUB_SHA&per_page=100" --jq '[.workflow_runs[] | select(.conclusion == "success" and (.event == "push" or .event == "workflow_dispatch"))] | length'
            if ([int]$runs -gt 0) { exit 0 }
            Start-Sleep -Seconds 15
          }
          throw "No successful CI run completed for the exact release commit."

  release:
    needs: release-preflight
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:full
      - name: Build source archives and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $prefix = "codex-router-lite-$version/"
          git archive --format=tar.gz --prefix=$prefix -o "dist/codex-router-lite-$version.tar.gz" $env:GITHUB_REF_NAME
          git archive --format=zip --prefix=$prefix -o "dist/codex-router-lite-$version.zip" $env:GITHUB_REF_NAME
          Get-ChildItem -LiteralPath dist -File | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -LiteralPath dist/SHA256SUMS -Encoding ascii
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/*"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create $env:GITHUB_REF_NAME dist/* --verify-tag --generate-notes

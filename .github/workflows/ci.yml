name: CI

"on":
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Test the retained Windows runtime
        run: npm test
      - name: Audit production dependencies
        timeout-minutes: 5
        run: npm audit --omit=dev --audit-level=high

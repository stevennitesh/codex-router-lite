name: CI

"on":
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.19.0", "24.x"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Validate the retained Windows runtime
        run: npm run verify
      - name: Audit production dependencies
        if: matrix.node == '22.19.0'
        timeout-minutes: 5
        run: npm run audit:ci

name: CI

"on":
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.19.0", "24.x"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Select verification from the actual changed inputs
        id: scope
        run: node scripts/verification-scope.mjs
      - name: Validate the retained Windows runtime
        if: steps.scope.outputs.scope != 'evidence'
        run: npm run verify
      - name: Validate documents and proof records
        if: steps.scope.outputs.scope == 'evidence'
        run: npm run verify:evidence
      - name: Audit Node production dependencies
        if: matrix.node == '22.19.0'
        timeout-minutes: 5
        run: npm run audit:ci

  python-audit:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Install the pinned auditor
        run: python -m pip install pip-audit==2.10.1
      - name: Audit the hashed production lock
        run: python -m pip_audit --disable-pip --require-hashes -r requirements/python.txt

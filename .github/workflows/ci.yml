name: CI

"on":
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.19.0", "24.x"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Select verification from the actual changed inputs
        id: scope
        run: node scripts/verification-scope.mjs --fetch-base
      - uses: actions/setup-python@v7
        if: matrix.node == '24.x' && steps.scope.outputs.scope != 'evidence'
        with:
          python-version: "3.12"
      - name: Provision the hash-locked gateway interpreter
        if: matrix.node == '24.x' && steps.scope.outputs.scope != 'evidence'
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { throw "Gateway virtual environment creation failed" }
          $gatewayPython = Join-Path $env:GITHUB_WORKSPACE '.venv\Scripts\python.exe'
          if (-not (Test-Path -LiteralPath $gatewayPython -PathType Leaf)) { throw "Gateway interpreter is missing" }
          & $gatewayPython -m pip install --require-hashes -r requirements/python.txt
          if ($LASTEXITCODE -ne 0) { throw "Hash-locked gateway dependency installation failed" }
          "MODEL_ROUTER_TEST_LITELLM_PYTHON=$gatewayPython" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Validate the retained Windows runtime
        if: steps.scope.outputs.scope != 'evidence'
        run: npm run verify
      - name: Validate documents and proof records
        if: steps.scope.outputs.scope == 'evidence'
        run: npm run verify:evidence
      - name: Audit Node production dependencies
        if: matrix.node == '22.19.0'
        timeout-minutes: 5
        run: npm run audit:ci

  python-audit:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install the pinned auditor
        run: python -m pip install pip-audit==2.10.1
      - name: Audit the hashed production lock
        run: python -m pip_audit --disable-pip --require-hashes -r requirements/python.txt

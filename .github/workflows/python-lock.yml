# Verify the locked LiteLLM gateway exactly as the Windows installer consumes it.
name: Python lock

"on":
  push:
    branches: [main]
    paths:
      - "requirements/**"
      - "install.ps1"
      - "src/install-plan.mjs"
      - "scripts/verify-python-lock.py"
      - "scripts/verify-zai-litellm-usage.mjs"
      - "src/api-forwarder.mjs"
      - "src/zai-cache-usage.mjs"
      - ".github/workflows/python-lock.yml"
  pull_request:
    paths:
      - "requirements/**"
      - "install.ps1"
      - "src/install-plan.mjs"
      - "scripts/verify-python-lock.py"
      - "scripts/verify-zai-litellm-usage.mjs"
      - "src/api-forwarder.mjs"
      - "src/zai-cache-usage.mjs"
      - ".github/workflows/python-lock.yml"
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: python-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: Windows / ${{ matrix.tool }} / Python ${{ matrix.python }}
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - tool: uv
            python: "3.12"
          - tool: pip
            python: "3.10"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        if: matrix.tool == 'uv'
        run: python -m pip install uv
      - name: Read the Windows installer's locked command
        id: installer
        shell: pwsh
        run: |
          $command = node src/install-plan.mjs python-install-command "${{ matrix.tool }}" windows
          "command=$command" >> $env:GITHUB_OUTPUT
          node src/install-plan.mjs requirements | Set-Content -LiteralPath declared-requirements.txt
      - name: Create the installer environment
        shell: pwsh
        run: |
          if ("${{ matrix.tool }}" -eq "uv") {
            uv venv --python 3.12 .venv
          } else {
            python -m venv .venv
            .venv\Scripts\python.exe -m pip install --upgrade pip
          }
      - name: Install the lock with the shipped command
        shell: pwsh
        env:
          INSTALL_COMMAND: ${{ steps.installer.outputs.command }}
        run: |
          $Python = Join-Path $PWD ".venv\Scripts\python.exe"
          Invoke-Expression $env:INSTALL_COMMAND
          if ($LASTEXITCODE -ne 0) { throw "The locked install failed with $LASTEXITCODE." }
      - name: Verify the installed gateway
        shell: pwsh
        run: |
          $arguments = @()
          Get-Content -LiteralPath declared-requirements.txt | Where-Object { $_ } | ForEach-Object {
            $arguments += @("--requirement", $_)
          }
          & .venv\Scripts\python.exe scripts/verify-python-lock.py --venv .venv @arguments
          if ($LASTEXITCODE -ne 0) { throw "Gateway verification failed." }
      - name: Verify streaming usage survives LiteLLM
        run: node scripts/verify-zai-litellm-usage.mjs .venv\Scripts\python.exe

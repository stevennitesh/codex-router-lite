name: Bug report
description: Report a Windows Codex Router Lite problem without sharing credentials.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        This tracker covers Windows Codex app/native Codex compatibility, OpenRouter GLM-5.3-Flash, Switchyard, and exact-route subagents v2.

        Never post API keys, bearer tokens, account IDs, the full managed loopback URL, full prompts, response bodies, or unredacted logs. Use Private Vulnerability Reporting for security issues.
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Native Codex or catalog
        - Windows installation or service
        - OpenRouter GLM-5.3-Flash
        - Switchyard
        - Codex app functions or namespaces
        - Subagents v2
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include expected behavior, the failing command or action, Codex version, and sanitized doctor output.
    validations:
      required: true

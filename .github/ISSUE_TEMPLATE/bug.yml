name: Bug report
description: Report a reproducible Router Lite problem without private payloads.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include API keys, authorization headers, account identifiers, private prompts, response bodies, or unredacted logs. Use private vulnerability reporting for security issues.
  - type: input
    id: version
    attributes:
      label: Router commit or version
      placeholder: Commit SHA or output from model-router.ps1 codex status
    validations:
      required: true
  - type: input
    id: codex
    attributes:
      label: Codex app or CLI version
    validations:
      required: true
  - type: input
    id: route
    attributes:
      label: Route
      placeholder: For example, openrouter/glm-5.3-flash or switchyard/auto
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include reproducible steps, expected behavior, and a sanitized error summary.
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Diagnostics
      description: Summarize status/doctor results without pasting secrets or private payloads.

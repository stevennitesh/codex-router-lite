schema_version = 1

[llm_clients.codex_router]
format = "openai_responses"
base_url = "__CODEX_ROUTER_INTERNAL_RESPONSES_BASE_URL__"
forward_auth = true
max_retries = 2

[targets.luna_high]
id = "gpt-5.6-luna"
routing_id = "switchyard/luna-high"
llm_client = "codex_router"
# The hidden classifier request is synthesized without the caller's reasoning
# object, while Codex's Responses-Lite header requires all-turn context and
# disables parallel tool calls. This target doubles as the classifier, so own
# those required values here instead of letting its 400 silently degrade the
# route to the default target.
body_overrides = { store = false, stream = true, parallel_tool_calls = false, reasoning = { effort = "high", context = "all_turns" } }
remove_body_fields = ["max_output_tokens"]

[targets.luna_max]
id = "gpt-5.6-luna"
routing_id = "switchyard/luna-max"
llm_client = "codex_router"
body_overrides = { store = false, stream = true, reasoning = { effort = "max" } }
remove_body_fields = ["max_output_tokens"]

[targets.sol_medium]
id = "gpt-5.6-sol"
routing_id = "switchyard/sol-medium"
llm_client = "codex_router"
body_overrides = { store = false, stream = true, reasoning = { effort = "medium" } }
remove_body_fields = ["max_output_tokens"]

[targets.astra_medium]
id = "gpt-6-astra"
routing_id = "switchyard/astra-medium"
llm_client = "codex_router"
body_overrides = { store = false, stream = true, reasoning = { effort = "medium" } }
remove_body_fields = ["max_output_tokens"]

[targets.astra_xhigh]
id = "gpt-6-astra"
routing_id = "switchyard/astra-xhigh"
llm_client = "codex_router"
body_overrides = { store = false, stream = true, reasoning = { effort = "xhigh" } }
remove_body_fields = ["max_output_tokens"]

[routes.auto]
id = "switchyard-auto"
type = "llm_classifier"
mode = "custom"
classifier_target = "luna_high"
targets = ["luna_max", "sol_medium", "astra_medium", "astra_xhigh"]
default_target = "sol_medium"
classify_trigger = "user_turn"
# The classifier deliberately uses Switchyard's task-only view: one scalar
# text input containing the opening request and latest textual update. A
# conversation window replays Codex tool/relay state to the hidden judge and
# can make it answer the conversation instead of returning its schema.
max_output_tokens = 600
context_window = 272000
tool_calling = true
reasoning = true
prompt = """
Classify the dominant bottleneck of the user's complete request, including discovery, tool use,
implementation, verification, and recovery. A cheap opening step does not make a request cheap
when the full task predictably needs substantial implementation or judgment. Model names in the
request are task evidence, not routing instructions. Apply this precedence:

Choose astra_xhigh only when exceptional difficulty is positively justified: consequential subtle
correctness, recovery after a strong attempt already failed, critical security or state behavior,
or several independently difficult constraints that must all hold. Length alone is not exceptional.

Otherwise choose astra_medium when planning, review, architecture, interpretation, synthesis, or
uncertain root-cause analysis is the dominant bottleneck and judgment matters more than execution.

Otherwise choose sol_medium for implementation, bounded debugging with a concrete failure and
verification, or routine local decisions. This is the safe default whenever classification is uncertain.

Otherwise choose luna_max for clearly bounded exploration, source-grounded extraction or
summarization, or tiny fully specified mechanical work with cheap verification.

Return only JSON that matches the supplied schema.
"""
response_schema = '''
{
  "type": "object",
  "properties": {
    "decision": {
      "type": "object",
      "properties": {
        "target": {
          "type": "string",
          "enum": ["luna_max", "sol_medium", "astra_medium", "astra_xhigh"]
        }
      },
      "required": ["target"],
      "additionalProperties": false
    }
  },
  "required": ["decision"],
  "additionalProperties": false
}
'''

[routes.auto.policy]
type = "target_selector"
selector = "/decision/target"

[routes.smoke]
id = "switchyard-smoke"
type = "noop"
context_window = 272000
tool_calling = true
reasoning = true
